[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=/usr/bin/mold", "-Zshare-generics=y"]

[unstable]
codegen-backend = true

[profile.dev]
codegen-backend = "cranelift"

[profile.dev.package."*"]
codegen-backend = "llvm"

# Tests build with LLVM: cranelift cannot catch panics, so `catch_unwind` in cranelift code
# never catches and the crash-file tests fail. `just run` keeps cranelift.
[profile.test]
codegen-backend = "llvm"
