# cargo-deny configuration (spec 1.1.10). Run via `just deny` / `just ci-check`.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained advisories fail only for crates the workspace depends on directly.
# Transitive ones (e.g. ttf-parser under winit's Wayland decorations, RUSTSEC-2026-0192)
# are upstream's to resolve and are re-examined at each Bevy upgrade (/bevy-upgrade).
unmaintained = "workspace"

[licenses]
version = 2
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "OFL-1.1",
  "Unlicense",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# Bevy's dependency graph carries duplicate versions; warn, do not fail.
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version and are not wildcards in the risky sense.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
