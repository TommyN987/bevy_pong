[package]
name = "pong_core"
description = "Render-free simulation core for bevy_pong: kernel, vocabulary, features, persistence, tuning."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Render-free by construction (ADR 0001): no render, window, audio, or UI features here.
# `keyboard` and `serialize` let tuning carry `KeyCode` bindings as data; `bevy_color` is the
# palette's color type. None pulls a render, window, audio, or UI crate (checked on docs.rs).
bevy = { workspace = true, features = [
  "std",
  "async_executor",
  "bevy_asset",
  "bevy_state",
  "bevy_color",
  "keyboard",
  "serialize",
] }
serde.workspace = true
ron.workspace = true
thiserror.workspace = true

[features]
# The headless test harness (`src/testing`, spec 1.5.1). Shell tests and this crate's own
# integration tests turn it on; a game build never compiles it. Bevy's `debug` keeps system
# names (the schedule walker names the system that forgot its phase) and carries the
# schedule shuffle seed (spec 1.5.3).
testing = ["bevy/debug"]

[dev-dependencies]
# A dev-dependency on itself turns `testing` on for every test build of this crate, the
# unit tests included. Resolver 3 keeps it out of normal builds.
pong_core = { path = ".", features = ["testing"] }

[lints]
workspace = true
